name: 'Terraform CI'

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v3

      - name: 'Set up Terraform'
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: 'Terraform Fmt'
        run: terraform fmt -check -recursive

      - name: 'Terraform Init'
        run: |
          terraform init -backend=false
          cd examples/aws-only && terraform init -backend=false
          cd ../oci-only && terraform init -backend=false
          cd ../dual-cloud && terraform init -backend=false
          cd ../..

      - name: 'Terraform Validate'
        run: |
          terraform validate
          cd examples/aws-only && terraform validate
          cd ../oci-only && terraform validate
          cd ../dual-cloud && terraform validate
          cd ../..
